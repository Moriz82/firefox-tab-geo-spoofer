<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tab Geo Spoofer</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup">
      <h1>Tab Geo Spoofer</h1>
      <p id="tab-context" class="tab-context">Loading current tab...</p>
      <p id="status" class="status" aria-live="polite"></p>

      <section class="card">
        <h2>Coordinates</h2>
        <label for="latitude">Latitude</label>
        <input id="latitude" type="number" step="0.000001" min="-90" max="90" placeholder="37.7749" />

        <label for="longitude">Longitude</label>
        <input id="longitude" type="number" step="0.000001" min="-180" max="180" placeholder="-122.4194" />

        <label for="accuracy">Accuracy (meters)</label>
        <input id="accuracy" type="number" step="1" min="1" max="100000" value="20" />

        <div class="actions">
          <button id="apply-btn" type="button">Apply to Current Tab</button>
          <button id="reset-btn" type="button" class="secondary">Reset to Real Location</button>
        </div>
      </section>

      <section class="card">
        <h2>Map Picker</h2>
        <p class="hint">Click the map to set coordinates. Drag to pan and use mouse wheel to zoom.</p>
        <div id="map" class="map" role="application" aria-label="Map selector"></div>
        <div class="zoom-controls">
          <button id="zoom-out" type="button" class="secondary">-</button>
          <span id="zoom-level">Zoom 2</span>
          <button id="zoom-in" type="button" class="secondary">+</button>
        </div>
      </section>

      <section class="card">
        <h2>Presets</h2>
        <div class="preset-row">
          <input id="preset-name" type="text" maxlength="64" placeholder="Preset name" />
          <button id="save-preset-btn" type="button">Save</button>
        </div>
        <select id="preset-select" size="5"></select>
        <div class="actions">
          <button id="apply-preset-btn" type="button">Apply Preset</button>
          <button id="delete-preset-btn" type="button" class="secondary">Delete Preset</button>
        </div>
      </section>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
